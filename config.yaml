# ---------------------------------------------------------------------------
# History channel pipeline settings. Edit these; you don't need to touch code.
# ---------------------------------------------------------------------------

channel_name: "[Your channel name]"

# Claude model used for topics, research, scripts and image checks.
claude_model: "claude-opus-5-5"
# Image checks run ~60-90 times per video, so a cheaper model keeps costs down.
claude_image_model: "claude-sonnet-5"

# The four content lanes. The pipeline rotates through them so the
# channel doesn't become one repeated template.
lanes:
  - name: "Big events & empires"
    brief: "wars, empires, collapses, revolutions and turning points"
  - name: "People & dynasties"
    brief: "the rise and fall of historical figures, rulers and families"
  - name: "Mysteries & disasters"
    brief: "unsolved mysteries, disasters and strange historical episodes, told strictly from documented evidence"
  - name: "Regional histories"
    brief: "the history of a single city, country or region, told through one clear story"

# Narration target. 150 words per minute -> 8-12 minutes.
script_words_min: 1300
script_words_max: 1750

# ElevenLabs voice. Find voice IDs at elevenlabs.io > Voices > (voice) > ID.
elevenlabs_voice_id: "REPLACE_WITH_VOICE_ID"
# eleven_flash_v2_5 costs half the credits of eleven_multilingual_v2.
elevenlabs_model: "eleven_multilingual_v2"

# Images: Wikimedia Commons licences allowed. Share-alike (CC BY-SA) is off by
# default because it can impose licence terms on the finished video.
allowed_licences: ["public domain", "pd", "cc0", "cc by"]
allow_share_alike: false
min_image_width: 1200
image_relevance_threshold: 6   # 0-10 score from Claude's image check

# Optional background music: put a royalty-free MP3 at assets/music.mp3
music_volume: 0.08

# Suggested publish slots (UK time). Each finished video is given the next free
# slot, which you use when you schedule it in YouTube Studio.
timezone: "Europe/London"
publish_times: ["16:00", "19:30"]
